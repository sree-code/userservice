service: userservice
runtime: java17

env_variables:
  SPRING_PROFILES_ACTIVE: "prod"
  FIREBASE_PROJECT_ID: "seemee-backend"

automatic_scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.6

resources:
  cpu: 1
  memory_gb: 1

handlers:
- url: /.*
  script: auto
  secure: always
